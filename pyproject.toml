[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metalens"
version = "0.1.0"
description = "Scalable game-analytics pipeline over the Lichess open database"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15",
    "zstandard>=0.22",
]
# dev pulls in everything so `pip install -e .[dev]` always works end to end

[project.scripts]
metalens = "metalens.cli:main"

[project.optional-dependencies]
quality = ["duckdb>=1.0", "pandas>=2.0", "pandera>=0.20"]
orchestration = ["prefect>=3.0"]
ml = ["lightgbm>=4.0", "scikit-learn>=1.3", "shap>=0.45"]
dashboard = ["streamlit>=1.35"]
dev = [
    "pytest>=8", "python-chess>=1.10", "ruff",
    "duckdb>=1.0", "pandas>=2.0", "pandera>=0.20",
    "lightgbm>=4.0", "scikit-learn>=1.3", "shap>=0.45", "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
