[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metalens"
version = "0.1.0"
description = "Scalable game-analytics pipeline over the Lichess open database"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15",
    "zstandard>=0.22",
]

[project.scripts]
metalens = "metalens.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "python-chess>=1.10", "duckdb>=1.0", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
